[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seir_sim"
version = "0.1.0"
description = "Global reinfection SEIR spread simulator (ODE / SDE / CTMC / hybrid)"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5",
    "pydantic>=2.13",
    "PyYAML>=6.0",
    "scipy>=1.18",
    "numba>=0.68",
    "shapely>=2.2",
    "pyproj>=3.8",
    "rasterio>=1.5",
    "xarray>=2026.9",
    "h5netcdf>=1.8",
    "h5py>=3.16",
    "pyarrow>=26.0",
    "matplotlib>=3.11",
]

[project.optional-dependencies]
test = ["pytest>=9.1"]

[tool.setuptools.packages.find]
include = ["seir_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::seir_sim.simulate.result.LastBinWarning"]
